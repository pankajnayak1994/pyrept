site_name: pyrept
site_description: One HTML, JSON and JUnit XML test report for pytest, unittest, nose2, behave, Playwright and every CI.
site_url: https://pankajnayak1994.github.io/pyrept/
repo_url: https://github.com/pankajnayak1994/pyrept
repo_name: pankajnayak1994/pyrept
edit_uri: edit/master/docs/
site_author: Pankaj Kumar Nayak
copyright: Developed by Pankaj Kumar Nayak · MIT licensed

exclude_docs: |
  demo/

theme:
  name: material
  logo: images/logo-mark.png
  favicon: images/logo-mark.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Frameworks: frameworks.md
  - Converting reports: converters.md
  - CI, gates and notifications: ci.md
  - Comparison and history: history.md
  - Customising: customize.md
  - Live demo: https://pankajnayak1994.github.io/pyrept/demo/report.html

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
