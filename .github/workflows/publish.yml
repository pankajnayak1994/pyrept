name: Auto Tag + Publish to PyPI for pyrept package

on:
  pull_request:
    types: [closed]
    branches:
      - master
  # A release published by hand in the GitHub UI (needed to update the GitHub Marketplace
  # listing) is uploaded to PyPI as well. Releases created by the "release" job below use
  # GITHUB_TOKEN, which never triggers workflows, so nothing is published twice.
  release:
    types: [published]
  # Re-publish an existing version tag (for example after a failed upload).
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, such as v1.3.1
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    # Every merged pull request is released, except ones labelled "skip-release" or titled "[SKIP] ..."
    # (Dependabot's CI-only updates use the label).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.labels.*.name, 'skip-release') &&
      !startsWith(github.event.pull_request.title, '[SKIP]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run tests before tagging and publishing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          python -m pytest

      - name: Get latest version tag
        id: get_latest_tag
        run: |
          # Only full versions (v1.2.3): the moving major tag (v1) must never be read as one.
          tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          tag="${tag:-v1.0.0}"
          echo "Latest tag is: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Get PR title
        id: pr_title
        uses: actions/github-script@v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            if (!pr.data.merged) {
              core.setFailed("❌ PR was closed but not merged.");
              return;
            }
            const title = pr.data.title;
            console.log("🔍 PR title:", title);
            core.setOutput("title", title);

      - name: Bump version based on PR title
        id: bump
        env:
          PR_TITLE: ${{ steps.pr_title.outputs.title }}
        run: |
          version="${{ steps.get_latest_tag.outputs.tag }}"
          version="${version#v}"
          IFS='.' read -r major minor patch <<< "$version"
          if [[ "$PR_TITLE" == \[MAJOR\]* ]]; then
            major=$((major + 1)); minor=0; patch=0
          elif [[ "$PR_TITLE" == \[MINOR\]* ]]; then
            minor=$((minor + 1)); patch=0
          elif [[ "$PR_TITLE" == \[PATCH\]* ]]; then
            patch=$((patch + 1))
          else
            echo "Missing Version Bump Type. Hence Defaulting to PATCH"
            patch=$((patch + 1))
          fi
          new_tag="v$major.$minor.$patch"
          echo "📦 New tag: $new_tag"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: Create and push Git tag
        run: |
          git config user.name "pankajnayak1994"
          git config user.email "nayakpankaj2015@gmail.com"
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push origin "${{ steps.bump.outputs.new_tag }}"

      - name: Build distribution
        run: |
          # The version comes from the new tag, never from other tags on the same commit (such as v1).
          new_tag="${{ steps.bump.outputs.new_tag }}"
          pip install build twine
          SETUPTOOLS_SCM_PRETEND_VERSION="${new_tag#v}" python -m build
          ls dist

      - name: Upload to PyPI
        run: twine upload dist/* --verbose

      - name: Move the major version tag (v1, v2, ...) used by the GitHub Action
        run: |
          new_tag="${{ steps.bump.outputs.new_tag }}"
          git tag -f "${new_tag%%.*}" "$new_tag"
          git push -f origin "refs/tags/${new_tag%%.*}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.new_tag }}" dist/* \
            --title "${{ steps.bump.outputs.new_tag }}" --generate-notes --verify-tag

      # pytest-pyrept is an alias package (packaging/pytest-pyrept) released with the same version.
      # One-time setup on PyPI: add a trusted publisher for the project "pytest-pyrept"
      # (owner pankajnayak1994, repository pyrept, workflow publish.yml). Until then this step
      # only warns, so it can never block a pyrept release.
      - name: Publish the pytest-pyrept alias package
        continue-on-error: true
        run: |
          version="${{ steps.bump.outputs.new_tag }}"
          version="${version#v}"
          sed -i -E "s/^version = \".*\"/version = \"$version\"/; s/\"pyrept>=[^\"]*\"/\"pyrept>=$version\"/" \
            packaging/pytest-pyrept/pyproject.toml
          python -m build packaging/pytest-pyrept --outdir alias-dist
          twine upload alias-dist/* --verbose --skip-existing || {
            echo "::warning::pytest-pyrept was not published; add the PyPI trusted publisher (see the release job)"
            exit 1
          }

  release-from-ui:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check the tag is a version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG is not a version like v1.2.3; nothing is published"
            exit 1
          fi

      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run tests before publishing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          python -m pytest

      - name: Build distribution
        run: |
          pip install build twine
          SETUPTOOLS_SCM_PRETEND_VERSION="${TAG#v}" python -m build
          ls dist

      - name: Upload to PyPI
        run: twine upload dist/* --verbose --skip-existing

      - name: Move the major version tag (v1, v2, ...) used by the GitHub Action
        run: |
          git tag -f "${TAG%%.*}" "$TAG"
          git push -f origin "refs/tags/${TAG%%.*}"

      - name: Publish the pytest-pyrept alias package
        continue-on-error: true
        run: |
          version="$TAG"
          version="${version#v}"
          sed -i -E "s/^version = \".*\"/version = \"$version\"/; s/\"pyrept>=[^\"]*\"/\"pyrept>=$version\"/" \
            packaging/pytest-pyrept/pyproject.toml
          python -m build packaging/pytest-pyrept --outdir alias-dist
          twine upload alias-dist/* --verbose --skip-existing || {
            echo "::warning::pytest-pyrept was not published; add the PyPI trusted publisher (see the release job)"
            exit 1
          }
