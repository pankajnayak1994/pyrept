# "pytest-pyrept" on PyPI: an alias that installs pyrept, so people searching the
# pytest plugin list (which is built from pytest-* package names) find it.
# Publish it by hand when pyrept's minimum version below changes:
#   python -m build packaging/pytest-pyrept && twine upload packaging/pytest-pyrept/dist/*
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-pyrept"
version = "1.3.0"
description = "pytest plugin for searchable HTML, JSON and JUnit XML test reports (installs pyrept)."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Pankaj Kumar Nayak", email = "nayakpankaj2015@gmail.com"},
]
dependencies = ["pyrept>=1.3"]
keywords = ["pytest", "pytest-plugin", "html-report", "test-report", "junit", "playwright", "ci"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/pankajnayak1994/pyrept"
Documentation = "https://pankajnayak1994.github.io/pyrept/"

[tool.setuptools]
# No code of its own: the pytest plugin is registered by pyrept itself.
py-modules = []
